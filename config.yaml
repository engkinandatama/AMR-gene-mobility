# ============================================================
# config.yaml — Konfigurasi Sentral Pipeline AMR Gene Mobility
# ============================================================

# ------------------------------------------------------------
# RUN IDENTITY — Ubah ini untuk memberi nama percobaan Bapak
# ------------------------------------------------------------
run_id: "pilot_run"               # Nama folder output (results/pilot_run/)
sample_map: "data/metadata/pilot_map.csv"  # Path ke daftar sampel

# ------------------------------------------------------------
# PATHS
# ------------------------------------------------------------
paths:
  contigs_dir:   "data/contigs"
  sample_map:    "data/metadata/pilot_map.csv"
  results_dir:   "results"
  logs_dir:      "logs"

# ------------------------------------------------------------
# SAMPLE SELECTION — Kriteria Kurasi Dataset (01_fetch_metadata.R)
# ------------------------------------------------------------
sample_selection:
  n_per_country: 50
  random_seed: 42
  body_site: "stool"
  countries:
    DNK: "Europe"
    CHN: "East_Asia"
    IND: "South_Asia"
    CMR: "Sub-Saharan_Africa"
    MDG: "Sub-Saharan_Africa"
  country_names:
    DNK: "Denmark"
    CHN: "China"
    IND: "India"
    CMR: "Cameroon"
    MDG: "Madagascar"
  require_ncbi_accession: true
  require_number_reads: true
  min_reads: 10000000
  disease_status: "healthy"
  antibiotics_current_use: "no"
  sequencing_platforms:
    - "IlluminaHiSeq"
    - "IlluminaNextSeq"
  study_condition: "control"
  infant_age_threshold: 3
  max_infant_per_country: 5

# ------------------------------------------------------------
# RESOURCES — Alokasi CPU & Thread (HPC Mahameru)
# ------------------------------------------------------------
resources:
  threads_sra: 2
  threads_fastp: 4
  threads_bowtie: 8
  threads_megahit: 16
  threads_rgi: 8
  threads_mobsuite: 8
  threads_integron: 4
  threads_isescan: 8
  threads_stats: 2
  max_memory_mb: 32000

# ------------------------------------------------------------
# TOOL PARAMETERS
# ------------------------------------------------------------
rgi:
  alignment_tool: "BLAST"
  input_type: "contig"
  min_identity: 95
  min_coverage: 95

mobsuite:
  min_length: 1000

integronfinder:
  mode: "local-max"
  report_calin: true

isescan:
  pass: true

stats:
  p_adjust_method: "BH"
  alpha: 0.05
  permanova_permutations: 999
  min_samples_per_group: 2

network:
  min_cooccurrence: 1
  layout: "fr"

fastp:
  qualified_quality: 20
  length_required: 50

megahit:
  preset: "meta-large"
  min_contig_len: 1000

host_removal:
  hg38_index: "databases/hg38/hg38"
  alignment_mode: "very-sensitive"
