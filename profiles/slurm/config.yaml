# =============================================================================
# Snakemake SLURM Profile — HPC BRIN Mahameru
# =============================================================================
# Compatible: Snakemake v7.x & v8.x (cluster mode)
#
# CARA PAKAI:
#   Pilot run (MaxJobs=3, akun baru):
#     snakemake all --profile profiles/slurm --use-conda --jobs 3
#
#   Full run (setelah admin upgrade MaxJobs):
#     snakemake all --profile profiles/slurm --use-conda --jobs 50
#
#   BATCH PROCESSING 250 sampel → 5 batch:
#     snakemake all --profile profiles/slurm --use-conda --batch all=1/5
#     snakemake all --profile profiles/slurm --use-conda --batch all=2/5
#     snakemake all --profile profiles/slurm --use-conda --batch all=3/5
#     snakemake all --profile profiles/slurm --use-conda --batch all=4/5
#     snakemake all --profile profiles/slurm --use-conda --batch all=5/5
#
#   CATATAN PENTING tentang Batch:
#   - Gunakan SATU sample_map.csv yang berisi semua 250 sampel
#   - Snakemake otomatis skip sampel yang output-nya sudah ada
#   - Flag --batch membatasi berapa target yang diproses per run
#   - Ini mencegah double-processing dan aman untuk resume setelah crash
#
# PARTISI YANG TERSEDIA DI MAHAMERU:
#   short        : maks 1 hari  (24 jam) | 48 nodes
#   medium-small : maks 3 hari  (72 jam) | 22 nodes
#   medium-large : maks 3 hari  (72 jam) | 12 nodes
#   interactive  : maks 2 jam             | 2  nodes
# =============================================================================

# Perintah submit ke SLURM — membaca resources dari rule Snakefile
# Kita arahkan log system SLURM ke dalam folder hasil (pilot_run)
cluster: "sbatch --partition={resources.partition} --mem={resources.mem_mb}M --cpus-per-task={threads} --time={resources.runtime} --output=results/pilot_run/logs/slurm/{rule}_%j.out --error=results/pilot_run/logs/slurm/{rule}_%j.err --job-name=amr_{rule}"

# Max job concurrent — sesuaikan dengan MaxJobs akun kamu
# Akun default BRIN: MaxJobs=3 | Setelah upgrade admin: ganti ke 50
jobs: 3

# Tunggu file muncul di GPFS filesystem setelah job selesai (detik)
# GPFS di Mahameru perlu waktu sinkronisasi — JANGAN dikurangi
latency-wait: 120

# Lanjutkan job lain meski satu job gagal
keep-going: true

# Auto-rerun job yang tidak selesai (crash/timeout dari run sebelumnya)
rerun-incomplete: true

# Aktifkan Conda environment management
use-conda: true

# Default resources jika rule tidak mendefinisikan sendiri
default-resources:
  - partition="short"
  - mem_mb=8000
  - runtime=120
